stages:
  extract:
    cmd: python -m arabic_legal_rag.ingestion.build_corpus data/raw/egyptian_civil_code.pdf data/processed/civil_code.json
    deps:
      - data/raw/egyptian_civil_code.pdf
      - src/arabic_legal_rag/ingestion
    outs:
      - data/processed/civil_code.json
  validate:
    cmd: python -m pytest tests/test_corpus_validation.py -q
    deps:
      - data/processed/civil_code.json
      - tests/test_corpus_validation.py

  index:
    cmd: python -m arabic_legal_rag.ingestion.index
    deps:
      - data/processed/civil_code.json
      - src/arabic_legal_rag/ingestion
      - src/arabic_legal_rag/config.py
    params:
      - chunk_text
      - embedding_model
      - query_prefix
      - passage_prefix
      - batch_size
    outs:
      - data/index
    metrics:
      - reports/index_manifest.json:
          cache: false
  evaluate:
    cmd: uv run python -m arabic_legal_rag.evaluation.ragas_eval
    deps:
      - data/index
      - data/eval/qa_50_ragas.jsonl
      - src/arabic_legal_rag/evaluation
      - src/arabic_legal_rag/generation
    params: [embedding_model, chunk_text, top_k, llm_temperature]
    metrics:
      - reports/ragas_metrics.json:
          cache: false
