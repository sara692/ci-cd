[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arabic-legal-rag"
version = "0.1.0"
description = "Arabic legal Q&A over the Egyptian Civil Code (RAG)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pdfplumber",
  "arabic-reshaper",
  "python-bidi",
  "chromadb",
  "rank-bm25",
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "httpx",
  "openai",
  "pyyaml",
  "python-dotenv",
  "numpy",
]

[project.optional-dependencies]
track = [
    "mlflow",
    "ragas",
    "datasets",
    "langchain-openai>=1.6.7",
    "langchain-community==0.4.1",
]
serve = ["bentoml", "locust"]            # vllm / autoawq: install separately on a GPU machine
monitor = ["langfuse", "prometheus-client"]
drift   = ["evidently", "scikit-learn", "scipy"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "black",
  "mypy",
  "pre-commit",
  "dvc",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arabic_legal_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the built index and the embeddings API (EMBED_API_KEY)"]
