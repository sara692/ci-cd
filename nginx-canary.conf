events {}
http {
  upstream stable { server rag-stable:8000; }
  upstream canary { server rag-canary:8000; }

  # stage 1 = 5%. Edit the percentage for each stage, then: docker compose exec nginx nginx -s reload
  # $request_id splits per request (good for a demo); use "${remote_addr}" to keep each client on one version.
  split_clients "${request_id}" $backend {
      5%   canary;
      *    stable;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://$backend;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
      add_header X-Backend $backend always;
    }
  }
}
